<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng điều hành RH Chinh Nguyễn · v10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00a758;--green-d:#06874a;--green-dd:#0b3d26;--green-l:#e7f7ee;--green-ll:#f3fbf6;
  --ink:#101828;--ink-2:#344054;--muted:#667085;--line:#e4e7ec;--line-2:#eef0f3;--bg:#f5f7f6;--surface:#fff;
  --up:#067647;--up-bg:#dcfae6;--down:#b42318;--down-bg:#fee4e2;--warn:#b54708;--warn-bg:#fef0c7;--info:#175cd3;--info-bg:#e8f1ff;
  --silver:#8b94a3;--gold:#c99a06;--plat:#4f6bd8;--fa:#98a2b3;
  --radius:14px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green-d)}
.num{font-variant-numeric:tabular-nums}

/* ---------- cổng đăng nhập ---------- */
#gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:linear-gradient(160deg,var(--green-dd),#0f5133 60%,#13693f)}
.gate-card{width:100%;max-width:420px;background:#fff;border-radius:20px;padding:28px 26px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.gate-brand{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--green);display:grid;place-items:center;color:#fff;flex:none}
.gate-card h1{font-size:20px;margin:0 0 6px}
.gate-card p{color:var(--muted);margin:0 0 16px;line-height:1.5}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field input{padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}
.field input:focus{outline:2px solid var(--green);outline-offset:1px;border-color:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:10px;border:1px solid #d0d5dd;background:#fff;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:#f9fafb}.btn:disabled{opacity:.5;cursor:default}
.btn-primary{background:var(--green);border-color:var(--green);color:#fff}.btn-primary:hover{background:var(--green-d)}
.btn-block{width:100%;padding:12px}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn-ghost{border-color:transparent;background:transparent}
.err{color:var(--down);font-size:13px;min-height:18px;margin-bottom:8px}
.ok{color:var(--up)}

/* ---------- khung ứng dụng ---------- */
#app{display:none;min-height:100vh}
body.ready #app{display:grid;grid-template-columns:248px 1fr}
body.ready #gate{display:none}
.side{background:var(--green-dd);color:#d7efe1;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px}
.side .brand{display:flex;gap:10px;align-items:center;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:8px}
.side .brand b{color:#fff;font-size:15px;display:block}.side .brand span{font-size:12px;opacity:.75}
.nav-sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:#d7efe1;text-decoration:none;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:#fff;color:var(--green-dd);font-weight:600}
.nav svg{width:18px;height:18px;flex:none}
.side .foot{margin-top:auto;font-size:12px;opacity:.85;padding:12px 8px;border-top:1px solid rgba(255,255,255,.1);line-height:1.6}
.main{min-width:0}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top h2{margin:0;font-size:18px}.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.top-r{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;background:#fff;white-space:nowrap}
.chip b{color:var(--green-d)}
.menu-btn{display:inline-flex;font-size:16px;line-height:1;padding:6px 10px}
body.ready #app{transition:grid-template-columns .2s ease}
@media (min-width:861px){
  body.side-collapsed.ready #app{grid-template-columns:68px 1fr}
  body.side-collapsed .side{padding:18px 10px;overflow-x:hidden}
  body.side-collapsed .side .brand{justify-content:center;padding:4px 0 16px}
  body.side-collapsed .side .brand>div:not(.logo),body.side-collapsed .nav-sec,body.side-collapsed .nav a .nl,body.side-collapsed .side .foot{display:none}
  body.side-collapsed .nav a{justify-content:center;padding:10px 0}
  body.side-collapsed .nav a svg{width:20px;height:20px}
}
.content{padding:20px 24px 40px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;max-width:1500px}.content>*{min-width:0}.main{overflow-x:clip}

/* ---------- thành phần ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line-2)}
.panel-h h3{margin:0;font-size:15px}.panel-h p{margin:3px 0 0;color:var(--muted);font-size:12.5px;line-height:1.45}
.panel-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);display:grid;gap:6px;position:relative;overflow:hidden}
.kpi .lb{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.kpi .s{font-size:12.5px;color:var(--muted);line-height:1.4}
.kpi .d{display:flex;gap:6px;flex-wrap:wrap}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.delta.up{background:var(--up-bg);color:var(--up)}.delta.down{background:var(--down-bg);color:var(--down)}.delta.flat,.delta.na{background:#f2f4f7;color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:#f2f4f7;color:#475467;white-space:nowrap}
.b-green{background:var(--up-bg);color:var(--up)}.b-red{background:var(--down-bg);color:var(--down)}.b-amber{background:var(--warn-bg);color:var(--warn)}.b-blue{background:var(--info-bg);color:var(--info)}
.b-silver{background:#eef0f3;color:#4b5565}.b-gold{background:#fdf3d0;color:#8a6a00}.b-plat{background:#e6ebff;color:#3247a8}
.muted{color:var(--muted)}.small{font-size:12px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--info-bg);color:#1849a9;font-size:13px;line-height:1.5}
.banner.warn{background:var(--warn-bg);color:#93370d}
.tbl-wrap{overflow:auto;max-width:100%}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:left;white-space:nowrap;vertical-align:middle}
.tbl th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600;background:#fafbfb;position:sticky;top:0;z-index:1}
.tbl td.r,.tbl th.r{text-align:right}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--green-ll)}
.tbl tr.sel td{background:var(--green-ll)}.sec-title{display:flex;align-items:baseline;gap:12px;margin:22px 2px 10px}.sec-title h2{font-size:16px;margin:0}.sec-title span{font-size:12px;color:var(--muted)}
.ops-kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.ops-k{display:flex;flex-direction:column;gap:6px}.ops-k .s{margin-top:auto}
.ops-row{display:grid;grid-template-columns:78px minmax(40px,1fr) 40px;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.ops-row b{text-align:right;color:var(--ink)}.ops-row small{grid-column:2/-1;margin-top:-4px;font-size:10.5px}.ops-row em{font-style:normal;grid-column:2/-1}
.chart .bar.est{fill:#c5e8d5}
.ops-chart.hide-tgt .s-tgt,.ops-chart.hide-plan .s-plan,.ops-chart.hide-aa .s-aa,.ops-chart.hide-req .s-req,.ops-chart.hide-req .gap-aa,.ops-chart.hide-req .gap-t.aa,.ops-chart.hide-aatgt .s-aatgt{display:none}
.ops-chart .fut-bg{fill:#f8f9fb}.ops-chart .gap-aa{fill:#fda29b;opacity:.6}.ops-chart text.gap-t.aa{font-size:10.5px}
.chart.big text{font-size:12px}.chart.big text.val{font-size:12.5px;font-weight:700}
.spk{display:inline-flex;align-items:flex-end;gap:2px;height:22px;vertical-align:middle}.spk i{display:block;width:6px;background:var(--green);border-radius:2px}
.mf-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.mf-card{border:1px solid var(--line-2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;background:#fff}.mf-card.pin{border-color:#f79009;box-shadow:0 0 0 2px #fef0c7}
.mf-top{display:flex;justify-content:space-between;align-items:center;gap:8px}.mf-cat{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.mf-pill{font-size:11.5px;padding:2px 9px;border-radius:999px;background:#f2f4f7;color:var(--ink-2);white-space:nowrap}.mf-pill.hot{background:#fef3f2;color:#b42318;font-weight:600}
.mf-t{margin:0;font-size:16px;line-height:1.3}.mf-b{margin:0;font-size:13px;color:var(--ink-2);line-height:1.5}
.mf-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}.mf-stats>div{border-radius:12px;padding:10px;background:#f8fafc;display:grid;gap:2px}
.mf-stats>div.ok{background:#ecfdf3}.mf-stats>div.warn{background:#fffaeb}.mf-stats b{font-size:24px;line-height:1}.mf-stats small{font-size:11.5px;color:var(--ink-2);line-height:1.3}
.mf-det{border:1px solid var(--line-2);border-radius:10px;padding:0 10px}.mf-det summary{cursor:pointer;padding:8px 0;font-size:13px;font-weight:600;color:var(--green-d)}.mf-det[open]{padding-bottom:8px}
.mf-tbl{width:100%;border-collapse:collapse;font-size:12.5px}.mf-tbl th{text-align:left;white-space:nowrap;font-weight:600;color:var(--muted);font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line-2)}.mf-tbl td{padding:5px 6px;border-bottom:1px solid #f2f4f7;white-space:nowrap}
.mf-tbl td small{display:block;color:var(--muted);font-size:10.5px}.mf-tbl a{color:inherit;font-weight:600}
.mf-a{margin:0;font-size:12.5px;line-height:1.5;color:#05603a;background:#ecfdf3;border-radius:10px;padding:8px 10px}.mf-a::before{content:'Gợi ý: ';font-weight:700}
.mf-f{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.mf-more{margin-top:14px}.mf-more summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0}
.mf-list td small{display:block;color:var(--muted);font-size:11.5px;white-space:normal;margin-top:2px}.mf-list td{white-space:normal}.mf-link{cursor:pointer}.mf-link:hover{color:var(--green-d)}
.mf-mini{display:inline-block;margin:0 10px 2px 0;font-size:12px;color:var(--ink-2)}.mf-mini b{font-size:14px;color:var(--ink)}
.ops-legend{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:6px;font-size:12px}
.ops-legend .lg-static{display:inline-flex;align-items:center;gap:5px;color:var(--muted);margin-right:6px}.ops-legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
.lg-t{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}.lg-t.off{opacity:.45;text-decoration:line-through}
.ops-chart text.ax{font-size:10.5px;fill:#667085}.ops-chart text.ax.aa,.ops-chart text.ax-t.aa{fill:#1570ef}.ops-chart text.ax-t{font-size:11px;font-weight:700;fill:#344054}
.ops-chart .bar.fc{fill:#f2f4f7;stroke:#98a2b3;stroke-width:1.3;stroke-dasharray:4 3}
.ops-chart .ln-fcf{fill:none;stroke:#12b76a;stroke-width:1.6;stroke-dasharray:3 4}
.ops-chart .ln-req{fill:none;stroke:#d92d20;stroke-width:2.2;stroke-dasharray:7 4}.ops-chart .dt-req{fill:#d92d20}.ops-chart text.lab.req{fill:#b42318;font-size:11.5px;font-weight:700}.ops-chart text.lab.tgt{fill:#b54708;font-size:11px;font-weight:700}.ops-chart text.val.small{font-size:10.5px;fill:#475467;font-weight:500}.ops-chart text.xl.cur{font-weight:700;fill:var(--green-d)}
.ops-chart .ln-aa{fill:none;stroke:#1570ef;stroke-width:2.4}.ops-chart .ln-aafc{fill:none;stroke:#1570ef;stroke-width:2;stroke-dasharray:5 4}
.ops-chart .dt-aa{fill:#1570ef}.ops-chart .dt-aa.est{fill:#b2ddff}.ops-chart .dt-aa.part{fill:#fff;stroke:#1570ef;stroke-width:2}.ops-chart .dt-aafc{fill:#fff;stroke:#1570ef;stroke-width:2}
.ops-chart .ln-aatgt{fill:none;stroke:#f79009;stroke-width:1.6;stroke-dasharray:2 3}.ops-chart .dt-aatgt{fill:#fff;stroke:#f79009;stroke-width:1.6}.ops-chart text.lab.aatgt{fill:#b54708;font-size:10.5px;font-weight:600}
.ops-chart text.lab.aa{fill:#175cd3;font-size:11px;font-weight:600}.ops-chart text.gap-t{font-size:11px;font-weight:700;fill:#912018}.ops-chart text.xl{font-size:12px}
.legend i.lg-fc{background:#f2f4f7;border:1.3px dashed #98a2b3;box-sizing:border-box}
.ops-chart .ln-tgt{fill:none;stroke:#f79009;stroke-width:2.2}.ops-chart .dt-tgt{fill:#fff;stroke:#f79009;stroke-width:2}
.ops-chart .ln-plan{fill:none;stroke:#7f56d9;stroke-width:2;stroke-dasharray:6 4}.ops-chart .dt-plan{fill:#fff;stroke:#7f56d9;stroke-width:2}
.ops-chart .ln-flat{fill:none;stroke:#98a2b3;stroke-width:2;stroke-dasharray:4 4}.ops-chart .ln-grow{fill:none;stroke:#2e90fa;stroke-width:2;stroke-dasharray:4 4}
.ops-chart .gap-neg{fill:#fda29b;opacity:.45}.ops-chart .gap-pos{fill:#a6f4c5;opacity:.5}
.gap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:12px}
.gap-c{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;display:grid;gap:3px}.gap-c span{font-size:12px;color:var(--muted)}.gap-c b{font-size:20px}.gap-c em{font-style:normal;font-weight:700;font-size:13px}.gap-c small{font-size:11.5px;color:var(--muted)}
.gap-c.neg{background:#fef3f2;border-color:#fecdca}.gap-c.neg em{color:#b42318}.gap-c.pos{background:#ecfdf3;border-color:#abefc6}.gap-c.pos em{color:#067647}.gap-c.tgt{background:#fffaeb;border-color:#fedf89}.gap-c.tgt em{color:#93370d;font-weight:600}
.drv-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}.drv{border:1px solid var(--line-2);border-radius:12px;padding:8px 10px}
.drv-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px}.drv-h small{color:var(--muted)}
.drv .ln-med{stroke:#98a2b3;stroke-dasharray:4 4}.drv .ln-act{fill:none;stroke:var(--green);stroke-width:2}.drv .dt-act{fill:var(--green)}.drv .dt-est{fill:#c5e8d5;stroke:var(--green)}.drv .dt-part{fill:#fff;stroke:var(--green);stroke-width:2}
.drv .dt-req{fill:#f04438}.drv text.val.req{fill:#b42318;font-weight:700}
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tcard{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:8px}.tcard:hover{border-color:var(--green);background:var(--green-ll)}
.tc-h{display:flex;justify-content:space-between}.tc-h .go{font-size:12px;color:var(--green)}.tc-big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.tc-big b{font-size:26px}.tc-big small{color:var(--muted);font-size:12px}
.tb-bars{display:grid;gap:5px}.tb-row{display:grid;grid-template-columns:62px minmax(40px,1fr) 40px;gap:6px;align-items:center;font-size:12px}.tb-row b{text-align:right}.tb-row small{grid-column:2/-1;margin-top:-3px;color:var(--muted);font-size:10.5px}
.tb-bars.wide .tb-row{grid-template-columns:118px minmax(40px,1fr) 40px}
/* Insight đội ngũ */
.ins-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.ins-card{border:1px solid var(--line-2);border-left:4px solid var(--green);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:6px;background:#fff}
.ins-card:hover{background:var(--green-ll)}.ins-card.warn{border-left-color:#f79009}
.ins-card .ins-t{display:flex;justify-content:space-between;gap:8px;font-weight:600;font-size:13px}.ins-card .go{color:var(--muted);font-weight:500;font-size:12px}
.ins-card .ins-big{font-size:26px;font-weight:700;line-height:1.1}.ins-card.warn .ins-big{color:#b54708}
.ins-card p{margin:0;font-size:12.5px;line-height:1.45;color:#344054}
.ins-h{margin:18px 0 6px;font-size:15px}
/* Thu nhập & chi phí */
.inc-ctrl{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:12px;background:#fafcfb;margin-bottom:6px;font-size:13px}
.inc-ctrl label{display:flex;align-items:center;gap:8px;font-weight:600}.inc-ctrl input[type=number]{width:64px;padding:4px 6px;border:1px solid var(--line);border-radius:8px}.inc-ctrl input[type=range]{width:160px;accent-color:var(--green)}.inc-ctrl select{padding:4px 6px;border:1px solid var(--line);border-radius:8px}
.inc-tbl td.inc-hl,.inc-tbl th.inc-hl{background:#e8f6ee}.inc-tbl tr.grp td{background:#f4f8f5;font-size:12.5px}.inc-tbl td small{font-size:11px}
.inc-ins{border:1px solid var(--line-2);border-left:4px solid var(--green);border-radius:12px;padding:10px 14px;background:#fff;font-size:13px}.inc-ins ul{margin:6px 0 0;padding-left:18px;display:grid;gap:5px}
.pl-top{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:6px}.pl-arrow{display:grid;place-items:center;font-size:22px;color:var(--muted)}
.pl-box{border:1px solid var(--line-2);border-radius:12px;padding:10px 12px;background:#fafafa}.pl-box.tgt{background:#ecfaf2;border-color:#9fdcbc}
.pl-k{font-size:12px;color:var(--muted)}.pl-v{font-size:24px;font-weight:700;margin:2px 0 6px}.pl-v small{font-size:13px;color:#067647;font-weight:700}
.pl-chips{display:flex;flex-wrap:wrap;gap:4px}.pl-chip{font-size:11.5px;padding:2px 8px;border-radius:999px;background:#fff;border:1px solid var(--line-2)}.pl-chip.ok{border-color:#9fdcbc;color:#067647}.pl-chip.bad{border-color:#fda29b;color:#b42318}
.pl-h{margin:14px 0 6px;font-size:13.5px}.pl-act{display:grid;grid-template-columns:26px 1fr auto;gap:8px;padding:8px 10px;border:1px solid var(--line-2);border-radius:10px;margin-bottom:6px;background:#fff;align-items:start}
.pl-n{width:24px;height:24px;border-radius:50%;background:#00A758;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}.pl-w{font-size:13.5px;line-height:1.4}.pl-who{font-size:11px;font-weight:700;color:#06874E;text-transform:uppercase;margin-right:6px;letter-spacing:.03em}

.oc-tiers .stack{flex:1}
.oc-hero{cursor:default;background:linear-gradient(180deg,#fff,#fbfdfc)}
.oc-hero .oc-h b{font-size:18px}.oc-hero .oc-h .av{width:46px;height:46px;font-size:15px}
.oc-hero .oc-m{grid-template-columns:repeat(6,minmax(0,1fr))}.oc-hero .oc-m2{grid-template-columns:repeat(3,minmax(0,1fr));max-width:620px}
.oc-h4{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px;background:#f7f9f8;border-radius:10px;overflow:hidden}
.oc-h4 th,.oc-h4 td{padding:5px 7px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.oc-h4 thead th{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
.oc-h4 tbody th{text-align:left;font-size:11px;color:var(--muted);font-weight:600}.oc-h4 td{font-weight:600}.oc-h4 .now{background:#e8f6ee;color:var(--green-d)}
.oc-h4 tbody tr+tr td,.oc-h4 tbody tr+tr th{border-top:1px solid #eceff2}
.oc-hero:hover{transform:none}
.oc-sec{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:4px 2px -4px}
.oc-btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-weight:600;font-size:12px;cursor:pointer;color:var(--ink-2)}
.oc-btn:hover{border-color:var(--green)}
/* ---------- thanh điều hướng dưới (mobile) ---------- */
#bnav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:55;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
#bnav a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--muted);text-decoration:none;padding:3px 4px;min-width:58px;font-weight:600;background:none;border:0;cursor:pointer}
#bnav a.on{color:var(--green-d)}
#bnav svg{width:22px;height:22px}
@media (max-width:860px){
  body.ready #bnav{display:flex}
  .top{flex-direction:column;align-items:stretch;gap:8px;padding:10px 12px}
  .top .sub,#page-sub{display:none}
  #page-title{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0}
  .top-r{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .top-r::-webkit-scrollbar{display:none}
  .top-r>*{flex:none}
  .top-r .select{max-width:78vw}
  .content{padding:12px 12px 90px;gap:12px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:10px 12px;gap:4px}.kpi .v{font-size:20px}.kpi .s{font-size:11.5px;line-height:1.35}.kpi .lb{font-size:10.5px}
  .kpi .d{flex-wrap:wrap}
  .panel-h{flex-direction:column;align-items:stretch;padding:12px 14px}
  .panel-h .toolbar{flex-wrap:wrap}
  .panel-h .toolbar .input{width:100%!important}
  .panel-b{padding:10px 12px}
  .tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:#fff;z-index:2;box-shadow:1px 0 0 var(--line-2)}
  .tbl th:first-child{z-index:3;background:#fafbfb}
  .tbl th,.tbl td{padding:7px 8px}
  .oc-grid{grid-template-columns:1fr;gap:10px}
  .oc-hero .oc-m{grid-template-columns:repeat(3,minmax(0,1fr))}
  .crumbs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.crumbs button{flex:none;max-width:60vw}
  #drawer{width:100vw}
  .legend{flex-wrap:wrap;gap:6px 12px}
  .chart{max-height:220px}
  .chart-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}.chart-scroll .chart-wide{min-width:720px;max-height:none!important}
}

<body>
<section id="gate"><div class="gate-card" id="gate-card"><p>Đang khởi động…</p></div></section>

<div id="app">
  <aside class="side">
    <div class="brand"><div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M6 20V9M12 20V4M18 20v-7"/></svg></div><div><b>RH Chinh Nguyễn</b><span>Bảng điều hành Đại lý & UM+</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot" id="side-foot"></div>
  </aside>
  <main class="main">
    <header class="top">
      <div style="display:flex;gap:10px;align-items:center;min-width:0">
        <button class="btn btn-sm menu-btn" id="menu-btn" aria-label="Mở menu">☰</button>
        <div style="min-width:0"><h2 id="page-title">…</h2><div class="sub" id="page-sub"></div></div>
      </div>
      <div class="top-r" id="top-r"></div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<nav id="bnav" aria-label="Điều hướng nhanh"></nav>
<div id="scrim"></div>
<aside id="drawer" aria-hidden="true"></aside>

  const shared = zip.file('xl/sharedStrings.xml') ? [...(await read('xl/sharedStrings.xml')).getElementsByTagNameNS('*', 'si')].map((si) => [...si.getElementsByTagNameNS('*', 't')].map((t) => t.textContent || '').join('')) : [];
  const sheets = [];

    const parts = (target.startsWith('/') ? target.slice(1) : 'xl/' + target).split('/'), out = [];

// ---------- nhận diện cấu trúc ----------
const filled = (row) => (row || []).filter((v) => String(v ?? '').trim() !== '');

  return Array.from({ length: Math.max(first.length, next.length) }, (_, i) => {
    const a = String(first[i] ?? '').trim(), b = String(next[i] ?? '').trim();
    return /^20\d{2}(0[1-9]|1[0-2])$/.test(a) || norm(a) === 'ytd' ? a : (b || a);

}
function findHeader(raw) {

  for (let i = 0; i < limit; i++) {
    const first = raw[i] || [], next = raw[i + 1] || [];
    for (const [key, sig] of SIGS) {
      let headers = first, rows = 1;
      if (key === 'recruitment' && first.some((v) => /^20\d{2}(0[1-9]|1[0-2])$/.test(String(v).trim()))) { headers = combineTwoRowHeader(first, next); rows = 2; }
      if (sig.every((s) => hasHeader(headers, s))) return { key, index: i, headerRows: rows, headers };
    }
  }
  // Không khớp mẫu: chọn dòng có nhiều ô chữ nhất (tiêu đề), phía dưới có dữ liệu
  let best = null;
  for (let i = 0; i < limit; i++) {
    const r = raw[i] || [], cells = filled(r);
    if (cells.length < 2 || cells.some(isMeta)) continue;
    const textCells = cells.filter((v) => isNaN(Number(String(v).replace(/,/g, '')))).length;
    const below = raw.slice(i + 1, i + 6).filter((x) => filled(x).length >= Math.max(2, cells.length * 0.4)).length;
    const score = textCells * 2 + below - (cells.length - textCells) * 2;
    if (textCells >= 2 && (!best || score > best.score)) best = { score, index: i };

}
function uniqueHeaders(headers) {

    let name = String(h ?? '').replace(/\s+/g, ' ').trim() || `Cột ${i + 1}`;
    const n = (seen.get(name) || 0) + 1; seen.set(name, n);

}
function excelDate(n) { const d = new Date(Math.round((n - 25569) * 864e5)); return isNaN(d) ? null : d.toISOString().slice(0, 10); }
function convert(value, header) {
  const s = String(value ?? '').trim();

  if (/^-?\d+(\.\d+)?(e[-+]?\d+)?$/i.test(s)) {

  }

}

const todayLocal = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
async function saveItem(file, item, onProgress) {
  const db = sb();
  const label = TYPES[item.key] || item.key;
  const path = `raw/${item.hash.slice(0, 16)}_${safeName(file.name)}`;
  const up = must(await db.from('data_uploads').insert({
    file_name: file.name, file_size: file.size, file_hash: item.hash, sheet_name: item.sheet, report_key: item.key, report_label: label,
    period: item.period || (SNAP_KEYS.has(item.key) ? todayLocal().slice(0, 7) : null), as_of: item.asOf || (SNAP_KEYS.has(item.key) ? todayLocal() : null), header_row: item.headerRow, columns: item.columns, row_count: item.rows.length,

    if (!item.fileUploaded) {
      const r = await db.storage.from(BUCKET).upload(path, file, { upsert: true, contentType: file.type || 'application/octet-stream' });
      if (r.error && !/exist/i.test(r.error.message || '')) throw new Error('Lưu file gốc: ' + r.error.message);
    }
    for (let i = 0; i < item.rows.length; i += BATCH) {
      const chunk = item.rows.slice(i, i + BATCH).map((data, j) => ({ upload_id: up.id, row_no: i + j + 1, data }));
      must(await db.from('data_rows').insert(chunk), 'Lưu dòng dữ liệu');
      onProgress?.(Math.min(item.rows.length, i + BATCH), item.rows.length);
    }
    must(await db.from('data_uploads').update({ status: 'ready' }).eq('id', up.id), 'Hoàn tất');
    return up.id;
  } catch (e) {
    await db.from('data_uploads').update({ status: 'failed', note: String(e.message).slice(0, 500) }).eq('id', up.id);
    throw e;
  }
}

async function fetchOriginal(u) {

// nhiều file → 1 file .zip (mỗi file gốc 1 lần, file trùng tên được đánh số)
async function downloadZip(list, onStep) {
  const files = [...new Map(list.filter((u) => u.storage_path).map((u) => [u.storage_path, u])).values()];
  if (!files.length) throw new Error('Không có file gốc nào để tải.');
  if (files.length === 1) return downloadOriginal(files[0]);
  if (!window.JSZip) throw new Error('Thiếu thư viện nén ZIP.');
  const zip = new window.JSZip(), used = new Map(), fail = [];
  for (let i = 0; i < files.length; i++) {
    const u = files[i]; onStep?.(i + 1, files.length);
    try {
      const blob = await fetchOriginal(u), d = String(u.created_at || '').slice(0, 10);
      let name = `${d} ${u.file_name}`; const n = used.get(name) || 0; used.set(name, n + 1);
      if (n) name = name.replace(/(\.[^.]+)?$/, ` (${n + 1})$1`);
      zip.file(name, blob);
    } catch (e) { fail.push(`${u.file_name}: ${e.message}`); }
  }
  if (fail.length === files.length) throw new Error(fail.join(' · '));
  const out = await zip.generateAsync({ type: 'blob' });
  saveBlob(out, `kho-du-lieu-${new Date().toISOString().slice(0, 10)}.zip`);
  return fail;
}

function draw() {

async function addFiles(files) {
  if (busy) return;
  flash = `Đang đọc ${files.length} file…`; draw();
  for (const file of files) {
    try {
      const { hash, sheets } = await readFile(file);
      let dup = [];
      try { dup = await existing(hash); } catch { dup = []; }
      const items = sheets.map((s) => analyzeSheet(s, file.name)).filter((it) => it.rows.length || it.headers.length);
      if (!items.length) { pending.push({ file, error: 'Không có sheet nào chứa dữ liệu.' }); continue; }
      const anyKnown = items.some((it) => it.key !== 'unknown');
      items.forEach((it) => {
        const isDup = dup.some((d) => d.sheet_name === it.sheet);
        const helper = it.key === 'unknown' && (anyKnown || /huong.?dan|readme|guide|note/.test(norm(it.sheet)));
        pending.push({ ...it, file, hash, duplicate: isDup, include: it.rows.length > 0 && !isDup && !helper && !(it.hidden && items.length > 1) });
      });
    } catch (e) { pending.push({ file, error: e.message }); }
  }
  flash = ''; draw();
}
async function saveAll() {
  if (busy) return;
  if (window.RH_ensureSession) { try { await window.RH_ensureSession(); } catch { flash = 'Phiên đăng nhập đã hết hạn hoặc chưa đăng nhập trên trình duyệt này – đăng xuất, đăng nhập lại rồi lưu.'; draw(); return; } }

  for (const p of todo) {
    const card = cards.get(p);

      await saveItem(p.file, { ...p, fileUploaded: uploadedFiles.has(p.hash) }, (d, t) => { if (card) card.textContent = `Đang lưu ${fmt0(d)}/${fmt0(t)} dòng…`; });
      uploadedFiles.add(p.hash); ok++;

    } catch (e) { errs.push(`${p.file.name} · ${p.sheet}: ${e.message}`); if (card) card.textContent = 'Lỗi: ' + e.message; }
  }
  busy = false;
  flash = `Đã lưu ${ok}/${todo.length} bộ dữ liệu.` + (errs.length ? ' Lỗi: ' + errs.join(' | ') : '');
  await refresh();
  if (ok) {
    // tự dựng lại dashboard từ dữ liệu mới
    flash += ' Đang cập nhật dashboard…'; draw();
    try { if (window.RH_ensureSession) await window.RH_ensureSession().catch(() => { throw new Error('Phiên đăng nhập đã hết hạn – đăng nhập lại rồi bấm "Dựng lại dashboard"'); }); must(await sb().rpc('v10_build'), 'Dựng lại dữ liệu'); flash = flash.replace(' Đang cập nhật dashboard…', ' Dashboard đã cập nhật theo dữ liệu mới.'); window.dispatchEvent(new CustomEvent('rh:rebuilt')); }
    catch (e) { flash = flash.replace(' Đang cập nhật dashboard…', ' Chưa dựng lại được dashboard: ' + e.message); }
    draw();
  }
}
async function refresh() { try { uploads = await listUploads(); listErr = ''; } catch (e) { listErr = e.message; } draw(); }

  const drop = host.querySelector('#dh-drop'), input = host.querySelector('#dh-file');
  if (drop) {
    drop.onclick = () => input.click();
    drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };

    await refresh();

  host.querySelectorAll('[data-dh-dl]').forEach((b) => b.onclick = async () => {
    const u = uploads.find((x) => String(x.id) === b.dataset.dhDl);
    b.disabled = true; b.textContent = 'Đang tải…';

  host.querySelectorAll('[data-dh-pick]').forEach((c) => c.onchange = () => { if (c.checked) picked.add(c.dataset.dhPick); else picked.delete(c.dataset.dhPick); draw(); });
  const pa = host.querySelector('#dh-pick-all'); if (pa) pa.onchange = () => { picked = pa.checked ? new Set(uploads.filter((u) => u.storage_path).map((u) => String(u.id))) : new Set(); draw(); };
  const zipRun = async (list) => {

  const da = host.querySelector('#dh-dl-all'); if (da) da.onclick = () => zipRun(uploads);

<script>// =====================================================================

(() => {

function mbaProg(a) {

// Silver fast-track cho ĐL mới (memo 0001M02/2026): M0–M2 đạt 3 HĐ + 40 triệu FYP + đào tạo SBW + ĐNCC ≥ 4 buổi/tháng (M0+M1, M2)
const FT = { fyp: 40000, cc: 3, dn: 4 };
function fastTrack(list) {
  const M = DS.months, ym = M[3], asOf = DS.meta.asOf;
  return list.map((a) => {
    const t = tenureAt(a, ym); if (t === null || t < 0 || t > 3) return null;
    const j = String(a.j).slice(0, 7), mp = DS.manproNew.get(a.c);
    const since = M.filter((m) => m >= j && monthDiff(j, m) <= 2);
    const fyp = mp && mp.fyp != null ? N(mp.fyp) : sum(since, (m) => a.fyp[M.indexOf(m)]);
    const cc = mp && mp.cc != null ? N(mp.cc) : sum(since, (m) => a.cc[M.indexOf(m)]);
    const sbw = mp ? mp.sbw === 'Y' : null, dn1 = mp ? N(mp.dn1) : null, dn2 = mp ? N(mp.dn2) : null;
    const parts = [Math.min(1, fyp / FT.fyp), Math.min(1, cc / FT.cc), sbw ? 1 : 0, dn1 === null ? 0 : Math.min(1, dn1 / FT.dn)];
    if (t >= 2) parts.push(dn2 === null ? 0 : Math.min(1, dn2 / FT.dn));

    const daysLeft = Math.ceil((end - new Date(asOf)) / 864e5);
    const fast = mp?.fast === 'Y';
    const miss = [fyp < FT.fyp && `FYP ${money(FT.fyp - fyp)}`, cc < FT.cc && `${FT.cc - cc} HĐ`, !sbw && 'đào tạo SBW', (dn1 === null || dn1 < FT.dn) && `ĐNCC M0+M1 ${FT.dn - N(dn1)} buổi`, t >= 2 && (dn2 === null || dn2 < FT.dn) && `ĐNCC M2 ${FT.dn - N(dn2)} buổi`].filter(Boolean);

}

// =====================================================================
//  INSIGHT ĐỘI NGŨ – cohort tân binh, pipeline MDRT, MBA Pro, UM mới, demographic, 3mAA
// =====================================================================
const TRANK = { FA: 0, UM: 1, SUM: 2, DM: 3, SDM: 4, BM: 5, SBM: 6, AM: 7, SAM: 8 };
const tRank = (t) => { const k = String(t || 'FA').toUpperCase(); return k in TRANK ? TRANK[k] : k === 'SA' ? 0 : 1; };
const ym7 = (d) => String(d || '').slice(0, 7);
const rateBadge = (r, hi = 0.5, lo = 0.3) => (r === null || r === undefined || !isFinite(r) ? '<span class="muted">–</span>' : `<span class="badge ${r >= hi ? 'b-green' : r >= lo ? 'b-amber' : 'b-red'}">${pct(r)}</span>`);
const heat = (r) => (r === null || r === undefined || !isFinite(r) ? '<td class="hm-na"></td>' : `<td class="r hm" style="background:rgba(0,167,88,${(0.08 + Math.min(1, r) * 0.72).toFixed(2)});color:${r > 0.55 ? '#fff' : 'inherit'}">${pct(r)}</td>`);
const yearNow = () => +String(DS.meta.asOf).slice(0, 4);
// thâm niên theo nhóm (tháng làm việc tính tới tháng gần nhất)
const TEN_B = [[0, 3, 'M0–M3'], [4, 6, 'M4–M6'], [7, 12, 'M7–M12'], [13, 24, '1–2 năm'], [25, 60, '2–5 năm'], [61, 120, '5–10 năm'], [121, 1e9, '> 10 năm']];
const tenBucket = (a) => { const t = tenureAt(a, DS.months[3]); if (t === null) return null; return TEN_B.findIndex(([lo, hi]) => t >= lo && t <= hi); };

// ---------- 1. cohort tân binh ----------
function insCohort(list) {
  const M = DS.months;
  const recent = M.map((m, mi) => {
    const xs = list.filter((a) => ym7(a.j) === m), ft = fastTrack(xs);
    const at = (k) => (mi + k <= 3 ? xs.filter((a) => isActive(a, mi + k)).length : null);
    const ever = xs.filter((a) => [0, 1, 2, 3].some((k) => mi + k <= 3 && isActive(a, mi + k))).length;
    return { m, n: xs.length, at: [0, 1, 2, 3].map(at), ever, cc3: ft.filter((x) => x.cc >= FT.cc).length, f40: ft.filter((x) => x.fyp >= FT.fyp).length,
      both: ft.filter((x) => x.cc >= FT.cc && x.fyp >= FT.fyp).length, pot: ft.filter((x) => x.status === 'pot').length, fast: ft.filter((x) => x.fast).length,
      fyp: sum(xs, (a) => sum([0, 1, 2, 3].filter((k) => mi + k <= 3), (k) => a.fyp[mi + k])) };
  });
  // cohort 12 tháng: ai gia nhập trong 12 tháng gần nhất (còn làm việc tới ngày chốt)
  const rows12 = [];
  for (let k = 12; k >= 0; k--) {
    const m = addMonths(M[3], -k), xs = list.filter((a) => ym7(a.j) === m);
    if (!xs.length) continue;
    rows12.push({ m, n: xs.length, ever: xs.filter((a) => N(a.cc12) > 0 || [0, 1, 2, 3].some((i) => isActive(a, i))).length,
      act3: xs.filter((a) => act3(a, 2) > 0).length, cur: xs.filter((a) => isActive(a, 3)).length, am: sum(xs, (a) => a.am12) / xs.length,
      fyp: sum(xs, (a) => a.fyp12) / xs.length, mp: xs.filter((a) => a.tier).length, um: xs.filter((a) => a.um).length,
      fast: xs.filter((a) => DS.manproNew.get(a.c)?.fast === 'Y').length, rehire: xs.filter((a) => a.rehire === 'Y').length });
  }
  // đường kích hoạt: tỷ lệ có HĐ theo tháng thâm niên (gộp 4 tháng quan sát)
  const curve = Array.from({ length: 13 }, () => ({ n: 0, a: 0 }));
  const matrix = rows12.map((r) => ({ m: r.m, cells: Array(13).fill(null) }));
  for (const a of list) {
    const j = ym7(a.j); if (!/^\d{4}-\d{2}$/.test(j)) continue;
    for (let i = 0; i < 4; i++) {
      const t = monthDiff(j, M[i]); if (t < 0 || t > 12) continue;
      const c = curve[t]; c.n++; if (isActive(a, i)) c.a++;
      const row = matrix.find((x) => x.m === j); if (row) { row.cells[t] = row.cells[t] || { n: 0, a: 0 }; row.cells[t].n++; if (isActive(a, i)) row.cells[t].a++; }
    }
  }
  return { recent, rows12, curve, matrix };
}

// ---------- 2. pipeline MDRT ----------
function insMdrt(list) {
  const M = DS.months, mq = DS.ins?.mq || {}, y = yearNow(), MV = MDRT[0].v;
  const asOf = String(DS.meta.asOf), dim = new Date(y, +asOf.slice(5, 7), 0).getDate();
  const nowPace = ((+asOf.slice(5, 7) - 1) + +asOf.slice(8, 10) / dim) / 12;
  // điểm mốc: hết T3 (Q1), T6 (Q2), T7*, T8* (ước theo FYP thực cấp tháng), T9 (Q3), hiện tại
  const w = (a, i) => Math.max(0, N(a.fyp[i]));
  const val = (a, k) => { const q = mq[a.c]; if (!q) return 0;
    if (k === 'q1') return N(q[0]); if (k === 'q2') return N(q[1]); if (k === 'q3') return N(q[2]); if (k === 'now') return N(q[3]);
    const d = N(q[2]) - N(q[1]), tot = w(a, 0) + w(a, 1) + w(a, 2);
    const share = tot > 0 ? (k === 'm7' ? w(a, 0) : w(a, 0) + w(a, 1)) / tot : k === 'm7' ? 1 / 3 : 2 / 3;
    return N(q[1]) + d * share; };
  const pts = [['q1', `${mLabel(`${y}-03`)}`, 3 / 12], ['q2', mLabel(`${y}-06`), 6 / 12], ['m7', mLabel(`${y}-07`) + '*', 7 / 12], ['m8', mLabel(`${y}-08`) + '*', 8 / 12], ['q3', mLabel(`${y}-09`), 9 / 12], ['now', `Đến ${dmy(asOf).slice(0, 5)}`, nowPace]]
    .filter(([k]) => k === 'now' || (k === 'm7' ? M.includes(`${y}-07`) : k === 'm8' ? M.includes(`${y}-08`) : true));
  const BK = [[1, 9, 'Đạt MDRT+', 'b-green'], [0.7, 1, '70–99%', 'b-amber'], [0.5, 0.7, '50–69%', ''], [0.3, 0.5, '30–49%', ''], [0.1, 0.3, '10–29%', '']];
  const has = list.filter((a) => mq[a.c]);
  const cols = pts.map(([k, lb, pace]) => { const rs = has.map((a) => val(a, k) / MV);
    return { k, lb, pace, b: BK.map(([lo, hi]) => rs.filter((r) => r >= lo && r < hi).length), onPace: rs.filter((r) => r >= pace && r < 1).length,
      cot: has.filter((a) => val(a, k) >= MDRT[1].v).length, sumFyp: sum(has, (a) => val(a, k)) }; });
  // ai đạt theo tháng (báo cáo MDRT: tháng đạt danh hiệu tạm tính)
  const codes = new Set(list.map((a) => a.c)), byMonth = {};
  for (const [c, x] of DS.mdrt) if (codes.has(c) && x.cur && x.month) { const m = `${String(x.month).slice(0, 4)}-${String(x.month).slice(4, 6)}`; byMonth[m] = (byMonth[m] || 0) + 1; }
  const months = Array.from({ length: +asOf.slice(5, 7) }, (_, i) => `${y}-${String(i + 1).padStart(2, '0')}`);
  let cum = 0; const ach = months.map((m) => ({ m, n: byMonth[m] || 0, cum: (cum += byMonth[m] || 0) }));
  // dịch chuyển T9 → hiện tại
  const bIdx = (r) => BK.findIndex(([lo, hi]) => r >= lo && r < hi);
  const ups = has.filter((a) => { const b0 = bIdx(val(a, 'q3') / MV), b1 = bIdx(val(a, 'now') / MV); return b1 >= 0 && (b0 < 0 || b1 < b0); }).length;
  const near = has.map((a) => ({ a, f: val(a, 'now'), r: val(a, 'now') / MV })).filter((x) => x.r >= 0.5 && x.r < 1).sort((p, q) => q.r - p.r);
  const left = 12 - (+asOf.slice(5, 7) - 1) - +asOf.slice(8, 10) / dim;
  return { pts, cols, BK, ach, ups, near, left, nowPace, MV, has: has.length };
}

// ---------- 3. MBA Pro ----------
function insMba(list) {
  const ums = list.filter((a) => a.um), rs = ums.map((a) => { const mb = DS.mba.get(a.c) || {}, p = mbaProg(a);
    const c = [N(mb.n1a) >= MBA.n1a[0] || N(mb.n1b) >= MBA.n1b[0], N(mb.fyc) >= MBA.fyc[0], N(mb.newUm) >= MBA.newUm, mb.p13 == null || N(mb.p13) >= MBA.p13];
    return { a, mb, r: p.r, c, ok: c.filter(Boolean).length, cur: mb.cur || null }; });
  const BK = [[1, 9, 'Đủ 4/4 mức Bạc'], [0.75, 1, '75–99%'], [0.5, 0.75, '50–74%'], [0.25, 0.5, '25–49%'], [0, 0.25, '< 25%']];

// ---------- 5. demographic & thăng / giáng cấp ----------
function insDemo(list) {
  const M = DS.months, y = String(yearNow()), py = String(yearNow() - 1);

  const ten = TEN_B.map(([, , lb], i) => { const xs = list.filter((a) => tenBucket(a) === i), fa = xs.filter((a) => !a.um);
    return { lb, n: xs.length, fa: fa.length, um: xs.length - fa.length, act: xs.filter((a) => act3(a, 2) > 0).length, even: xs.filter((a) => act3(a, 2) >= 2).length, fyp: sum(xs, fyp3), mp: xs.filter((a) => a.tier).length }; });
  const titles = Object.keys(TRANK).map((t) => { const xs = list.filter((a) => String(a.t).toUpperCase() === t); return { t, n: xs.length, ten: xs.length ? median(xs.map((a) => tenureAt(a, M[3]))) : null, act: xs.filter((a) => act3(a, 2) > 0).length, fyp: sum(xs, fyp3) }; }).filter((r) => r.n);

    return { upUm: xs.filter((a) => String(a.t).toUpperCase() === 'UM' && !(a.gtf_date || DS.gtf.has(a.c))), gtf: list.filter((a) => String(a.gtf_date || '').startsWith(yr)),
      inUm: xs.filter((a) => tRank(a.t) >= 2), toFa: xs.filter((a) => tRank(a.t) === 0) }; };
  const cur = mv(y), prev = mv(py);
  const months = Array.from({ length: +String(DS.meta.asOf).slice(5, 7) }, (_, i) => `${y}-${String(i + 1).padStart(2, '0')}`);
  const byM = months.map((m) => ({ m, upUm: cur.upUm.filter((a) => ym7(a.td) === m).length, gtf: cur.gtf.filter((a) => ym7(a.gtf_date) === m).length, inUm: cur.inUm.filter((a) => ym7(a.td) === m).length, toFa: cur.toFa.filter((a) => ym7(a.td) === m).length }));

      if (!a) { if (a0 && areas.has(a0) && !DS.by.get(c)) gone.push({ c, t0, a0 }); continue; }

// ---------- 6. 3mAA ----------
function insAA(list) {
  const M = DS.months, hm = [...(DS.histMonths || [])].filter((m) => m < M[0]).sort();
  const months = [...hm, ...M];
  const rows = months.map((m) => { const i = M.indexOf(m), aa = monthValue(m, 'active', list);
    const hc = i >= 0 ? list.filter((a) => ym7(a.j) <= m).length : (() => { const rs = histRows(m); return rs.length ? sum(rs, (r) => r.hc) : null; })();
    return { m, aa, hc, rep: i < 0, partial: i === 3 }; });
  rows.forEach((r, k) => { const w = rows.slice(Math.max(0, k - 2), k + 1).filter((x) => !x.partial && x.aa !== null); r.aa3 = r.partial ? null : w.length === 3 ? sum(w, (x) => x.aa) / 3 : null; r.rate = r.hc ? r.aa / r.hc : null; });
  const g = groupStats(list, 2);
  const byTen = TEN_B.map(([, , lb], i) => { const xs = list.filter((a) => tenBucket(a) === i); return { lb, n: xs.length, aa3: sum(xs, (a) => act3(a, 2)) / 3 }; });
  return { rows, g, byTen };
}

// ---------- biểu đồ cột + đường dùng chung ----------
function insChart(rows, { bar, line, fmtB = f0, fmtL = f0, lbB, lbL, h = 220 }) {
  const n = rows.length, W = Math.max(640, n * 46), pad = { l: 44, r: 12, t: 26, b: 26 }, step = (W - pad.l - pad.r) / n, H = h - pad.t - pad.b;
  const ok = (v) => v !== null && v !== undefined && isFinite(v);
  const mx = Math.max(1, ...rows.flatMap((r) => [r[bar], line ? r[line] : null]).filter(ok)) * 1.12;
  const y = (v) => pad.t + H * (1 - N(v) / mx), cx = (i) => pad.l + step * i + step / 2, bw = Math.min(30, step * 0.6);
  const lp = line ? rows.map((r, i) => (ok(r[line]) ? [cx(i), y(r[line])] : null)).filter(Boolean) : [];
  return `<div class="chart-scroll"><svg class="chart ins-chart" viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;min-width:${Math.min(W, 560)}px" role="img">
    ${[0, 0.5, 1].map((t) => `<line class="grid" x1="${pad.l}" x2="${W - pad.r}" y1="${pad.t + H * (1 - t)}" y2="${pad.t + H * (1 - t)}"/><text class="ax" x="${pad.l - 6}" y="${pad.t + H * (1 - t) + 4}" text-anchor="end">${fmtB(mx * t)}</text>`).join('')}
    ${rows.map((r, i) => (ok(r[bar]) ? `<rect class="${r.partial ? 'bar part' : r.rep ? 'bar rep' : 'bar'}" x="${cx(i) - bw / 2}" y="${y(r[bar])}" width="${bw}" height="${pad.t + H - y(r[bar])}" rx="3"><title>${mLabel(r.m)} · ${lbB}: ${fmtB(r[bar])}${line && ok(r[line]) ? ` · ${lbL}: ${fmtL(r[line])}` : ''}</title></rect>` : '')).join('')}
    ${lp.length > 1 ? `<path class="ln-aa" d="${lp.map((p, k) => `${k ? 'L' : 'M'}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' ')}"/>` : ''}
    ${line ? rows.map((r, i) => (ok(r[line]) ? `<circle class="dt-aa" cx="${cx(i)}" cy="${y(r[line])}" r="3"/>` : '')).join('') : ''}
    ${rows.map((r, i) => `<text class="xl" x="${cx(i)}" y="${h - 8}" text-anchor="middle">${esc(r.lb || mLabel(r.m))}</text>`).join('')}
    <text class="ax-t" x="${pad.l}" y="14">${esc(lbB)}${line ? ` · đường: ${esc(lbL)}` : ''}</text></svg></div>`;
}

// insight tự động: mỗi thẻ 1 phát hiện + con số + đi tới tab chi tiết
function insSummary(list) {
  const M = DS.months, y = yearNow();
  const C = insCohort(list), X = insMdrt(list), B = insMba(list), U = insNewUm(list), D = insDemo(list), A = insAA(list);
  const r4 = C.recent, nAll = sum(r4, (r) => r.n), m01 = sum(r4.slice(0, 3), (r) => r.n), m012 = sum(r4.slice(0, 2), (r) => r.n);
  const c0 = C.curve, rate = (t) => (c0[t].n ? c0[t].a / c0[t].n : null);
  const late = c0.slice(4).reduce((t, x) => ({ n: t.n + x.n, a: t.a + x.a }), { n: 0, a: 0 });
  const cards = [];
  const add = (tone, tab, title, big, text) => cards.push({ tone, tab, title, big, text });
  add(rate(0) !== null && rate(0) < 0.3 ? 'warn' : 'ok', 'cohort', 'Kích hoạt tân binh', pct(nAll ? sum(r4, (r) => r.ever) / nAll : null),
    `${f0(nAll)} tân binh ${mLabel(M[0])}–${mLabel(M[3])}: ${pct(rate(0))} có HĐ ngay M0, ${pct(m01 ? sum(r4.slice(0, 3), (r) => r.at[1]) / m01 : null)} có HĐ ở M1, ${pct(m012 ? sum(r4.slice(0, 2), (r) => r.at[2]) / m012 : null)} ở M2. Từ M4 trở đi tỷ lệ có HĐ mỗi tháng chỉ còn ${pct(late.n ? late.a / late.n : null)}.`);
  add(sum(r4, (r) => r.both) < 5 ? 'warn' : 'ok', 'cohort', 'Phễu fast-track', `${f0(sum(r4, (r) => r.both))} / ${f0(nAll)}`,
    `ĐL đủ 3 HĐ + 40 tr trong M0–M2. ${f0(sum(r4, (r) => r.cc3))} đủ 3 HĐ, ${f0(sum(r4, (r) => r.f40))} đủ 40 tr; ${f0(sum(r4, (r) => r.fast))} đã đạt Silver fast-track, ${f0(sum(r4, (r) => r.pot))} đang tiềm năng.`);
  const never = sum(C.rows12, (r) => r.n - r.ever), n12 = sum(C.rows12, (r) => r.n);
  add(n12 && never / n12 > 0.4 ? 'warn' : 'ok', 'cohort', 'Tân binh 12 tháng chưa có HĐ nào', f0(never), `${pct(n12 ? never / n12 : null)} trong ${f0(n12)} ĐL gia nhập 12 tháng qua (còn làm việc) chưa từng có HĐ thực cấp.`);
  const last = X.cols.at(-1), q3 = X.cols.find((x) => x.k === 'q3');

function planTrack(body, Y, YM) {
  const M = DS.months, list = DS.agents, save = S.area; S.area = 'all';
  const yT = pv(String(Y), 'TOTAL', 'fyp'), yNR = pv(String(Y), 'TOTAL', 'nr');
  const rows = YM.map((m) => {
    const actual = (k) => monthValue(m, k, list);
    return { m, pF: monthTarget(m), aF: actual('fyp'), pN: monthPlan(m, 'nr'), aN: actual('nr'), pA: monthPlan(m, 'aa'), aA: actual('active'), pC: monthPlan(m, 'cc'), aC: actual('cc'), partial: m === M[3], future: m > M[3] };
  });
  S.area = save;
  const done = rows.filter((r) => !r.future && r.aF !== null);
  const ytdF = sum(done, (r) => r.aF), ytdP = sum(done, (r) => r.pF), ytdN = sum(done, (r) => r.aN);
  const left = rows.filter((r) => r.m >= M[3]).length;
  const need = yT !== null ? Math.max(0, yT * 1000 - sum(done.filter((r) => !r.partial), (r) => r.aF)) : null;
  const kpi = (lb, v, s, d = '') => `<div class="kpi"><div class="lb">${lb}</div><div class="v num">${v}</div><div class="d">${d}</div><div class="s">${s}</div></div>`;
  const kpis = [
    kpi(`Target FYP năm ${Y}`, yT === null ? '–' : money(yT * 1000), yT === null ? (isAdmin ? 'Chưa nhập · vào tab "Nhập target"' : 'Admin chưa nhập') : `Target 12 tháng cộng lại: ${money(sum(rows, (r) => r.pF))}`),
    kpi('FYP thực tế lũy kế', money(ytdF), `${done.length} tháng có số · target cùng kỳ ${money(ytdP)}`, yT ? `<span class="badge ${ytdF / (yT * 1000) >= (done.length / 12) ? 'b-green' : 'b-amber'}">${pct(ytdF / (yT * 1000), 1)} target năm</span>` : ''),
    kpi('Cần mỗi tháng còn lại', need === null ? '–' : money(need / Math.max(1, left)), need === null ? 'Cần target năm' : `Còn ${money(need)} cho ${left} tháng (gồm ${mLabel(M[3])})`),
    kpi(`Tuyển mới (NR) lũy kế`, f0(ytdN), yNR ? `Target năm ${f0(yNR)} · đạt ${pct(ytdN / yNR, 1)}` : 'Chưa có target NR năm'),
  ].join('');
  const chartItems = rows.map((r) => ({ label: mLabel(r.m), v: r.aF, partial: r.partial, cls: SRC_CLS[monthSrc(r.m)], tip: `${mLong(r.m)}${SRC_NOTE[monthSrc(r.m)] || ''}\nThực tế: ${money(r.aF)}\nPlan: ${money(r.pF)}${r.pF && r.aF !== null ? `\nĐạt ${pct(r.aF / r.pF)}` : ''}` }));
  const planLine = (() => { // đường target vẽ chồng lên biểu đồ cột
    const W = Math.max(360, rows.length * 90), h = 190, pad = { l: 8, r: 8, t: 22, b: 26 }, step = (W - pad.l - pad.r) / rows.length;
    const max = Math.max(1, ...rows.map((r) => N(r.aF)), ...rows.map((r) => N(r.pF)));
    const pts = rows.map((r, i) => (r.pF === null ? null : [pad.l + step * i + step / 2, pad.t + (h - pad.t - pad.b) * (1 - N(r.pF) / max)]));
    const bw = Math.min(42, step * 0.6);
    const cols = rows.map((r, i) => { if (r.aF === null) return ''; const cx = pad.l + step * i + step / 2, yy = pad.t + (h - pad.t - pad.b) * (1 - N(r.aF) / max); return `<g data-tip="${esc(chartItems[i].tip)}"><rect x="${cx - step / 2}" y="${pad.t - 10}" width="${step}" height="${h - pad.t}" fill="transparent"/><path class="${r.partial ? 'bar part' : chartItems[i].cls || 'bar'}" d="M${cx - bw / 2},${h - pad.b} V${yy + 4} q0,-4 4,-4 h${bw - 8} q4,0 4,4 V${h - pad.b} Z"/><text class="val" x="${cx}" y="${yy - 6}" text-anchor="middle">${money(r.aF)}</text></g>`; }).join('');
    const labels = rows.map((r, i) => `<text x="${pad.l + step * i + step / 2}" y="${h - 8}" text-anchor="middle">${mLabel(r.m)}</text>`).join('');
    const line = pts.filter(Boolean).map((p, i) => `${i ? 'L' : 'M'}${p[0]},${p[1]}`).join(' ');
    const marks = pts.map((p, i) => (p ? `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#fff" stroke="#f79009" stroke-width="2"><title>Target ${mLabel(rows[i].m)}: ${money(rows[i].pF)}</title></circle>` : '')).join('');
    return `<div class="chart-scroll"><svg class="chart chart-wide" viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;max-height:${h + 40}px" role="img"><line class="grid" x1="0" x2="${W}" y1="${h - pad.b}" y2="${h - pad.b}"/>${cols}${line ? `<path d="${line}" fill="none" stroke="#f79009" stroke-width="2" stroke-dasharray="5 4"/>` : ''}${marks}${labels}</svg></div>`;
  })();
  const tr = (r) => `<tr class="${r.m === S.planMonth ? 'sel' : ''}"><td><b>${mLabel(r.m)}</b>${r.partial ? ' <span class="badge b-amber">đang chạy</span>' : ''}</td>
    <td class="r num">${money(r.pF)}</td><td class="r num">${money(r.aF)}</td>${pctCell(r.aF, r.pF)}
    <td class="r num">${f0(r.pA)}</td><td class="r num">${f0(r.aA)}</td>${pctCell(r.aA, r.pA)}
    <td class="r num">${f0(r.pC)}</td><td class="r num">${f0(r.aC)}</td>
    <td class="r num">${f0(r.pN)}</td><td class="r num">${f0(r.aN)}</td>${pctCell(r.aN, r.pN)}</tr>`;
  // phân khúc của tháng đang chọn
  const ym = S.planMonth, act = segActual(ym);
  const segRows = SEGS.map(([k, name]) => {
    const a = act?.seg[k], pF = pv(ym, k, 'fyp'), pA = pv(ym, k, 'aa');
    return `<tr><td>${esc(name)}</td><td class="r num">${a ? f0(a.hc) : '–'}</td><td class="r num">${f0(pA)}</td><td class="r num">${a ? f0(a.aa) : '–'}</td>${pctCell(a ? a.aa : null, pA)}<td class="r num">${pF === null ? '–' : money(pF * 1000)}</td><td class="r num">${a ? money(a.fyp) : '–'}</td>${pctCell(a ? a.fyp : null, pF === null ? null : pF * 1000)}<td class="r num">${a && a.cc ? money(a.fyp / a.cc) : '–'}</td><td class="r num">${a && a.aa ? nf2.format(a.cc / a.aa) : '–'}</td></tr>`;
  }).join('');
  body.innerHTML = `<div class="kpis">${kpis}</div>
  <section class="panel"><div class="panel-h"><div><h3>FYP thực tế vs Target · ${Y}</h3><p>Cột = thực tế (BC70, báo cáo tháng hoặc số nhập tay) · đường cam = target tháng</p></div></div><div class="panel-b">${planLine}<div class="legend"><span><i style="background:var(--green)"></i>Thực tế (BC70)</span><span><i style="background:#9fdcbc"></i>Tháng đang chạy</span><span><i style="background:#2e90fa"></i>Báo cáo tháng</span><span><i style="background:#7c8aa0"></i>Số nhập tay</span><span><i style="background:#f79009"></i>Target</span></div></div></section>
  <section class="panel"><div class="panel-h"><div><h3>Target vs Thực tế theo tháng</h3><p>${esc(rhShort())} · 1mAA = số ĐL có ≥1 HĐ thực cấp trong tháng</p></div></div><div class="panel-b" style="padding-top:6px"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tháng</th><th class="r">Target FYP</th><th class="r">TT FYP</th><th class="r">% đạt</th><th class="r">Target 1mAA</th><th class="r">TT 1mAA</th><th class="r">% đạt</th><th class="r">Target HĐ</th><th class="r">TT HĐ</th><th class="r">Target NR</th><th class="r">TT NR</th><th class="r">% đạt</th></tr></thead><tbody>${rows.map(tr).join('')}</tbody></table></div>
  <p class="note">Tháng chưa có số thực tế: nhập ở <a href="#history">KQKD các kỳ trước</a>. Tháng đang chạy là số tạm tính đến ${dmy(DS.meta.asOf)}.</p></div></section>
  <section class="panel"><div class="panel-h"><div><h3>Theo phân khúc · ${mLabel(ym)}</h3><p>${act ? `Nguồn thực tế: BC70 (phân khúc theo thâm niên tại tháng đó)${act.hasSA ? ' · SA từ báo cáo MAPA' : ' · SA chỉ có ở tháng có báo cáo MAPA'}` : 'Chưa có số thực tế theo phân khúc cho tháng này'}</p></div></div><div class="panel-b" style="padding-top:6px"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Phân khúc</th><th class="r">Nguồn lực</th><th class="r">Target 1mAA</th><th class="r">TT 1mAA</th><th class="r">% đạt</th><th class="r">Target FYP</th><th class="r">TT FYP</th><th class="r">% đạt</th><th class="r">Case size</th><th class="r">HĐ / ĐL có bán</th></tr></thead><tbody>${segRows}</tbody></table></div></div></section>`;
}

// ---------- tab 2: cần bao nhiêu 1mAA / HĐ ----------
function planCalc(body) {
  const ym = S.planMonth, M = DS.months;
  const P = productivity(S.planBasis), Y = S.planBasis === 'yoy' ? productivityYoy(ym) : null;
  const target = S.calcTarget != null ? S.calcTarget * 1000 : monthTarget(ym);
  const act = segActual(ym), atot = act ? totOf(act.seg) : null;
  const base = S.planBasis === 'yoy' && Y ? Y : P.TOTAL;
  const needCC = target && base.cs ? target / base.cs : null, needAA = needCC && base.cpa ? needCC / base.cpa : null;
  const hcNow = DS.agents.length + N(DS.meta.saCount);
  const basisName = { '3m': `TB 3 tháng ${P.months.map(mLabel).join(', ')}`, '1m': `tháng gần nhất ${mLabel(M[2])}`, yoy: `cùng kỳ ${mLabel(addMonths(ym, -12))}` }[S.planBasis];
  // phân bổ theo phân khúc: target FYP phân khúc nếu có, không thì theo tỷ trọng lịch sử
  const segPlanned = SEGS.some(([k]) => pv(ym, k, 'fyp') !== null);
  const segRows = SEGS.map(([k, name]) => {
    const p = P[k]; if (!p) return { k, name, none: true };
    const tF = segPlanned ? (pv(ym, k, 'fyp') ?? 0) * 1000 : target ? target * p.mix : null;
    const cc = tF && p.cs ? tF / p.cs : null, aa = cc && p.cpa ? cc / p.cpa : null;
    const a = act?.seg[k];
    return { k, name, p, tF, cc, aa, rate: aa && p.hc ? aa / p.hc : null, planAA: pv(ym, k, 'aa'), a };
  });
  const sumAA = sum(segRows, (r) => r.aa || 0), sumCC = sum(segRows, (r) => r.cc || 0);
  const daysIn = new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
  const elapsed = ym === M[3] ? Math.min(daysIn, +DS.meta.asOf.slice(8, 10)) : null;
  body.innerHTML = `
  <section class="panel"><div class="panel-h"><div><h3>Mục tiêu ${mLabel(ym)}</h3><p>Từ target tháng & năng suất lịch sử → số hợp đồng và số ĐL có bán (1mAA) cần đạt</p></div>
    <div class="toolbar"><label class="small muted">Dựa trên&nbsp;<select class="select" id="pl-basis"><option value="3m" ${S.planBasis === '3m' ? 'selected' : ''}>TB 3 tháng gần nhất</option><option value="1m" ${S.planBasis === '1m' ? 'selected' : ''}>Tháng gần nhất</option><option value="yoy" ${S.planBasis === 'yoy' ? 'selected' : ''}>Cùng kỳ năm trước</option></select></label>
    <label class="small muted">Target FYP (triệu)&nbsp;<input class="input" id="pl-target" style="width:120px;text-align:right" inputmode="decimal" value="${target ? Math.round(target / 1000) : ''}" placeholder="nhập để thử"></label></div></div>
    <div class="panel-b">
    ${!target ? `<div class="banner warn">Chưa có target FYP cho ${mLong(ym)}. ${isAdmin ? 'Nhập ở tab "Nhập target" hoặc gõ số vào ô Target ở trên để tính thử.' : 'Gõ số vào ô Target để tính thử.'}</div>` : ''}
    ${S.planBasis === 'yoy' && !Y ? `<div class="banner warn">Chưa có số ${mLong(addMonths(ym, -12))} (FYP, HĐ, ĐL hoạt động) – nhập ở <a href="#history">KQKD các kỳ trước</a>. Tạm dùng TB 3 tháng.</div>` : ''}
    <div class="kpis">
      <div class="kpi"><div class="lb">Target FYP</div><div class="v num">${money(target)}</div><div class="s">${S.calcTarget != null ? 'Số đang thử (chưa lưu)' : 'Theo target đã nhập'}</div></div>
      <div class="kpi"><div class="lb">Case size bình quân</div><div class="v num">${money(base.cs)}</div><div class="s">FYP / hợp đồng · ${esc(basisName)}</div></div>
      <div class="kpi"><div class="lb">HĐ / 1 ĐL có bán</div><div class="v num">${base.cpa ? nf2.format(base.cpa) : '–'}</div><div class="s">FYP mỗi ĐL có bán mang về: ${money(base.fpa)}</div></div>
      <div class="kpi"><div class="lb">Cần số hợp đồng</div><div class="v num">${f0(needCC && Math.ceil(needCC))}</div><div class="s">= Target ÷ case size</div></div>
      <div class="kpi"><div class="lb">Cần 1mAA (ĐL có bán)</div><div class="v num">${f0(needAA && Math.ceil(needAA))}</div><div class="s">= HĐ cần ÷ HĐ/ĐL · ${needAA ? pct(needAA / hcNow, 1) + ' trên ' + f0(hcNow) + ' nguồn lực (gồm SA)' : ''}</div></div>
      <div class="kpi"><div class="lb">Thực tế ${elapsed ? `đến ${dmy(DS.meta.asOf)}` : 'tháng'}</div><div class="v num">${atot ? f0(atot.aa) : '–'} ĐL · ${atot ? f0(atot.cc) : '–'} HĐ</div><div class="s">${atot ? `FYP ${money(atot.fyp)}${target ? ' · đạt ' + pct(atot.fyp / target, 1) : ''}${elapsed ? ` · đã qua ${elapsed}/${daysIn} ngày` : ''}` : 'Chưa có số'}</div></div>
    </div>
    ${target && needAA ? `<div class="banner"><span>🎯</span><div>Để đạt <b>${money(target)}</b> trong ${mLong(ym)}: với case size bình quân <b>${money(base.cs)}</b> và mỗi ĐL có bán mang về <b>${nf2.format(base.cpa)} HĐ</b> (${money(base.fpa)}), vùng cần khoảng <b>${f0(Math.ceil(needCC))} hợp đồng</b> từ <b>${f0(Math.ceil(needAA))} ĐL có bán</b>${atot && elapsed ? ` — hiện đã có ${f0(atot.aa)} ĐL / ${f0(atot.cc)} HĐ, còn thiếu <b>${f0(Math.max(0, Math.ceil(needAA) - atot.aa))} ĐL</b> và <b>${f0(Math.max(0, Math.ceil(needCC) - atot.cc))} HĐ</b> trong ${daysIn - elapsed} ngày còn lại` : ''}.</div></div>` : ''}
    </div></section>
  <section class="panel"><div class="panel-h"><div><h3>Theo phân khúc</h3><p>${segPlanned ? 'FYP phân khúc theo target đã nhập' : 'Chưa có target phân khúc → chia target theo tỷ trọng FYP lịch sử'} · năng suất: ${esc(S.planBasis === 'yoy' ? 'TB 3 tháng (phân khúc)' : basisName)}</p></div></div>
    <div class="panel-b" style="padding-top:6px"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Phân khúc</th><th class="r">Tỷ trọng FYP</th><th class="r">FYP cần</th><th class="r">Case size</th><th class="r">HĐ / ĐL có bán</th><th class="r">HĐ cần</th><th class="r">1mAA cần</th><th class="r">Nguồn lực</th><th class="r">Tỷ lệ HĐ cần</th><th class="r">Tỷ lệ HĐ lịch sử</th><th class="r">Target 1mAA</th><th class="r">TT 1mAA</th></tr></thead><tbody>
    ${segRows.map((r) => r.none ? `<tr><td>${esc(r.name)}</td><td colspan="11" class="muted">Chưa có số lịch sử</td></tr>` : `<tr><td>${esc(r.name)}</td><td class="r num">${pct(r.p.mix, 1)}</td><td class="r num">${money(r.tF)}</td><td class="r num">${money(r.p.cs)}</td><td class="r num">${r.p.cpa ? nf2.format(r.p.cpa) : '–'}</td><td class="r num">${f0(r.cc && Math.ceil(r.cc))}</td><td class="r num"><b>${f0(r.aa && Math.ceil(r.aa))}</b></td><td class="r num">${f0(r.p.hc)}</td><td class="r num">${r.rate !== null && r.p.rate !== null ? `<span class="badge ${r.rate <= r.p.rate * 1.1 ? 'b-green' : r.rate <= r.p.rate * 1.4 ? 'b-amber' : 'b-red'}" title="So với tỷ lệ lịch sử">${pct(r.rate, 1)}</span>` : '–'}</td><td class="r num">${pct(r.p.rate, 1)}</td><td class="r num">${f0(r.planAA)}</td><td class="r num">${r.a ? f0(r.a.aa) : '–'}</td></tr>`).join('')}
    <tr style="font-weight:700;background:#f9fafb"><td>Cộng</td><td></td><td class="r num">${money(sum(segRows, (r) => r.tF || 0))}</td><td></td><td></td><td class="r num">${f0(Math.ceil(sumCC))}</td><td class="r num">${f0(Math.ceil(sumAA))}</td><td></td><td></td><td></td><td class="r num">${f0(monthPlan(ym, 'aa'))}</td><td class="r num">${atot ? f0(atot.aa) : '–'}</td></tr>
    </tbody></table></div>
    <p class="note">Tỷ lệ HĐ cần = 1mAA cần ÷ nguồn lực phân khúc. Xanh: ngang lịch sử · vàng: phải cao hơn 10–40% · đỏ: phải cao hơn &gt;40% (khó đạt nếu không tăng nguồn lực/năng suất). Phân khúc tính theo thâm niên tại từng tháng; ManPro theo danh hiệu hiện tại. SA chỉ có số từ báo cáo MAPA.</p></div></section>`;
  $('#pl-basis').onchange = (e) => { S.planBasis = e.target.value; render(); };
  $('#pl-target').onchange = (e) => { const v = e.target.value.trim().replace(/\./g, '').replace(',', '.'); S.calcTarget = v === '' || isNaN(+v) ? null : +v; render(); };
}

// ---------- tab 3: nhập target ----------
function planInput(body, Y, YM) {
  const ym = S.planMonth, P = productivity('3m'), M = DS.months;
  const isAll = planScope() === 'ALL', canEdit = isAdmin && !isAll;
  const dis = canEdit ? '' : 'disabled';
  // bảng tham khảo theo đầu RH
  const ref = rhReference(ym);
  const gr = (t, base) => (t === null || !base ? '<td class="r muted">–</td>' : `<td class="r"><span class="badge ${t / base >= 1.3 ? 'b-red' : t / base >= 1 ? 'b-green' : 'b-amber'}">${t / base >= 1 ? '+' : ''}${pct(t / base - 1, 0)}</span></td>`);
  const refRow = (r) => `<tr class="${r.id === 'ALL' ? 'tot' : ''}${r.id === planScope() ? ' sel' : ''}" ${r.id !== 'ALL' && isAll ? `data-pick-rh="${esc(r.id)}" style="cursor:pointer"` : ''}><td><b>${esc(r.name)}</b><br><small class="muted">${f0(r.hc)} nguồn lực</small></td>
    ${r.m3.map((x) => `<td class="r num">${money(x.fyp)}<br><small class="muted">${f0(x.aa)} ĐL · ${f0(x.cc)} HĐ</small></td>`).join('')}
    <td class="r num" style="background:#f6fef9"><b>${money(r.fyp)}</b></td><td class="r num" style="background:#f6fef9">${f1(r.aa)}</td><td class="r num" style="background:#f6fef9">${f1(r.cc)}</td><td class="r num" style="background:#f6fef9">${f1(r.nr)}</td><td class="r num" style="background:#f6fef9">${r.cc ? money(r.fyp / r.cc) : '–'}</td>
    <td class="r num">${r.py ? money(r.py.fyp) : '–'}${r.py ? `<br><small class="muted">${f0(r.py.cc)} HĐ · NR ${f0(r.py.nr)}</small>` : ''}</td>
    <td class="r num"><b>${r.tF === null ? '–' : money(r.tF)}</b>${r.tA !== null ? `<br><small class="muted">1mAA ${f0(r.tA)}</small>` : ''}</td>${gr(r.tF, r.fyp)}${gr(r.tF, r.py?.fyp)}</tr>`;

    <select class="select" id="lib-cat">${cats.map((s) => `<option ${S.libCat === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
    <span class="muted small">${f0(rows.length)} kết quả</span></div>
    ${LIB.length ? `<div class="lib-grid">${rows.map((p) => `<div class="lib-card" data-lib="${esc(p.id)}" tabindex="0"><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="badge ${LIB_TONE[p.st]}">${p.st}</span>${p.category ? `<span class="badge">${esc(p.category)}</span>` : ''}${(p.audience || []).map((x) => `<span class="badge b-silver">${esc(x)}</span>`).join('')}</div><b>${esc(p.title)}</b><span class="small muted">${esc(p.code || '')} · ${p.start_date ? dmy(p.start_date) : '…'} – ${p.end_date ? dmy(p.end_date) : 'dài hạn'}</span><span class="small">${esc(p.summary || '')}</span></div>`).join('')}</div>` : '<div class="empty">Thư viện đang trống.</div>'}
  </div></section>`;
  const qi = $('#lib-q'); qi.oninput = () => { clearTimeout(qi._t); qi._t = setTimeout(() => { S.libQ = qi.value; pageLibrary(c).then(() => { const n = $('#lib-q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }); }, 250); };
  $('#lib-st').onchange = (e) => { S.libStatus = e.target.value; pageLibrary(c); };
  $('#lib-cat').onchange = (e) => { S.libCat = e.target.value; pageLibrary(c); };
  bindMemoFocus(c);
  $$('[data-lib]', c).forEach((el) => { el.onclick = () => openPolicy(el.dataset.lib); el.onkeydown = (e) => { if (e.key === 'Enter') openPolicy(el.dataset.lib); }; });
  if (isAdmin) {
    $('#lib-imp').onclick = () => $('#lib-file').click();
    $('#lib-file').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return; const msg = $('#lib-msg');
      try {
        const rows = JSON.parse(await f.text());
        if (!Array.isArray(rows) || !rows.every((r) => r.id && r.title)) throw new Error('File không đúng định dạng thư viện.');
        const clean = rows.map((r) => ({ id: r.id, code: r.code || null, title: r.title, folder: r.folder || null, category: r.category || null, audience: r.audience || [], start_date: r.start || r.start_date || null, end_date: r.end || r.end_date || null, summary: r.summary || '', points: r.points || [], versions: r.versions || [], drive_url: r.drive_url || null, content: r.content || '', source: r.source || 'memo', sent: r.sent || null }));
        for (let i = 0; i < clean.length; i += 25) {
          const res = await sb.from('policies').upsert(clean.slice(i, i + 25)); if (res.error) throw new Error(res.error.message);
          msg.textContent = `Đang nạp ${Math.min(clean.length, i + 25)}/${clean.length}…`;
        }
        LIB = null; await pageLibrary(c); $('#lib-msg').innerHTML = `<span class="ok">Đã nạp ${clean.length} tài liệu.</span>`;
      } catch (x) { msg.innerHTML = `<span class="err">${esc(x.message)}</span>`; }
    };
  }
}
async function openPolicy(id) {
  const p = LIB.find((x) => x.id === id); if (!p) return;
  $('#drawer').classList.remove('wide');
  $('#drawer').innerHTML = `<div class="dr-h"><div style="flex:1;min-width:0"><h3>${esc(p.title)}</h3><p>${esc(p.code || '')} · ${p.start_date ? dmy(p.start_date) : '…'} – ${p.end_date ? dmy(p.end_date) : 'dài hạn'} · <span class="badge ${LIB_TONE[libStatus(p)]}">${libStatus(p)}</span></p></div><button class="btn btn-sm btn-ghost" id="dr-x">✕</button></div>
  <div class="dr-b"><p style="margin:0;line-height:1.6">${esc(p.summary || '')}</p>
  ${(p.points || []).length ? `<div class="sec"><h4>Điểm chính</h4><ul style="margin:0;padding-left:18px;line-height:1.7">${p.points.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div>` : ''}
  ${p.drive_url ? `<p><a href="${esc(p.drive_url)}" target="_blank" rel="noopener">Mở file gốc trên Google Drive ↗</a></p>` : ''}
  ${(p.versions || []).length ? `<div class="sec"><h4>Phiên bản khác</h4>${p.versions.map((v) => `<div><a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a></div>`).join('')}</div>` : ''}
  <div class="sec"><h4>Toàn văn</h4><div class="prose" id="pol-content">Đang tải…</div></div></div>`;
  $('#drawer').classList.add('open'); $('#scrim').classList.add('open'); $('#dr-x').onclick = closeDrawer;
  const r = await sb.from('policies').select('content').eq('id', id).maybeSingle();
  const el = $('#pol-content'); if (el) el.textContent = r.data?.content || '(không có nội dung trích xuất)';
}

// =====================================================================
//  TRANG 6 · KHO DỮ LIỆU (admin)
// =====================================================================
function rhMapPanel() {
  const opts = (sel) => rhList().map((g) => `<option value="${g.id}" ${sel === g.id ? 'selected' : ''}>${esc(g.id === 'other' ? 'Other' : g.name)}</option>`).join('');
  const cnt = (id) => DS.areasAll.filter((a) => a.rh === id).length;
  return `<section class="panel"><div class="panel-h"><div><h3>Phân đầu RH theo khu vực</h3><p>Tự chia theo Layer 3 / Trưởng Vùng / PSM+ trong báo cáo. Đổi ô "Thuộc RH" nếu khu vực chuyển nhánh hoặc khu vực mới chưa nhận đúng – áp dụng ngay cho mọi trang.</p></div>
    <div class="toolbar"><button class="btn btn-primary btn-sm" id="rhm-save" disabled>Lưu phân đầu</button></div></div>
    <div class="panel-b" style="padding-top:6px"><div id="rhm-msg" class="note">${rhList().map((g) => `<span class="chip">${esc(g.id === 'other' ? 'Other' : g.name)} <b>${cnt(g.id)}</b> KV</span>`).join(' ')}</div>
    <div class="tbl-wrap" style="max-height:420px"><table class="tbl"><thead><tr><th>Khu vực</th><th>PSM+ quản lý</th><th>Trưởng Vùng (báo cáo)</th><th>Layer 3</th><th class="r">Nguồn lực</th><th>Tự nhận</th><th>Thuộc RH</th></tr></thead><tbody>
    ${DS.areasAll.map((a) => `<tr><td><b>${esc(a.code)}</b></td><td>${esc(a.psm || '–')}</td><td>${esc(a.tv || '–')}</td><td>${esc(a.l3 || '–')}</td><td class="r num">${f0(a.list.length)}</td><td class="muted small">${esc(rhShort(a.rhAuto))}</td>
      <td><select class="select" data-rhm="${esc(a.code)}" ${isAdmin ? '' : 'disabled'} style="${RHO[a.code] ? 'border-color:#f79009' : ''}">${opts(a.rh)}</select></td></tr>`).join('')}
    </tbody></table></div></div></section>`;
}
function bindRhMap() {
  const changed = new Map();
  $$('[data-rhm]').forEach((el) => el.onchange = () => { changed.set(el.dataset.rhm, el.value); el.style.borderColor = '#f79009'; $('#rhm-save').disabled = false; });
  const btn = $('#rhm-save'); if (!btn) return;
  btn.onclick = async () => {
    btn.disabled = true;
    const next = { ...RHO };
    for (const [code, id] of changed) { const ar = DS.areasAll.find((a) => a.code === code); if (ar && ar.rhAuto === id) delete next[code]; else next[code] = id; }
    const r = await sb.from('app_settings').upsert({ key: 'rh_area_override', value: next });
    if (r.error) { $('#rhm-msg').innerHTML = `<span class="err">${esc(r.error.message)}</span>`; btn.disabled = false; return; }
    RHO = next; applyScope(); renderNav();
    $('#rhm-msg').innerHTML = `<span class="ok">Đã lưu phân đầu RH cho ${changed.size} khu vực – các trang đã cập nhật.</span>`;
    changed.clear();
  };
}
function pageData(c) {
  c.innerHTML = `<section class="panel"><div class="panel-h"><div><h3>Dựng lại dashboard</h3><p>Sau khi tải báo cáo mới (BC70, Báo cáo KD ĐL, MDRT, MBA Pro, ManPro, M0-M1…) bấm nút này để dashboard dùng số mới. Hệ thống tự lấy bản mới nhất của từng loại.</p></div><button class="btn btn-primary" id="rebuild">Dựng lại dashboard</button></div>
    <div class="panel-b" id="rb-msg">${DS ? `Bản đang dùng: dữ liệu chốt <b>${dmy(DS.meta.asOf)}</b> · dựng lúc ${esc(new Date(DS.builtAt).toLocaleString('vi-VN'))} · ${f0(DS.agents.length)} đại lý` : '<span class="err">Chưa có bộ dữ liệu dashboard.</span>'}</div></section>
    ${DS ? rhMapPanel() : ''}
    <div id="hub"></div>`;
  window.RHDataHub?.mount($('#hub'));
  if (DS) bindRhMap();
  $('#rebuild').onclick = async () => {
    const b = $('#rebuild'); b.disabled = true; b.textContent = 'Đang dựng…'; $('#rb-msg').textContent = 'Đang tổng hợp dữ liệu trên database…';
    const fail = (m) => { $('#rb-msg').innerHTML = authErr(m) ? `<span class="err">${esc(sessionMsg)}</span> <button class="btn btn-sm" id="rb-relogin">Đăng nhập lại</button>` : `<span class="err">${esc(m)}</span>`; const rl = $('#rb-relogin'); if (rl) rl.onclick = () => signOut(); b.disabled = false; b.textContent = 'Dựng lại dashboard'; };
    try { await ensureSession(); } catch { return fail('SESSION'); }
    const r = await sb.rpc('v10_build');
    if (r.error) return fail(r.error.message);
    await loadDataset();
    $('#rb-msg').innerHTML = `<span class="ok">Đã dựng xong bộ dữ liệu #${r.data} · chốt ${dmy(DS.meta.asOf)} · ${f0(DS.agents.length)} đại lý.</span>`;
    b.disabled = false; b.textContent = 'Dựng lại dashboard'; renderNav();
  };
}

// Kho dữ liệu tự dựng lại sau khi lưu file → nạp bộ dữ liệu mới
window.addEventListener('rh:rebuilt', async () => {
  try {
    await loadDataset(); renderNav();
    const m = document.getElementById('rb-msg');
    if (m && DS) m.innerHTML = `<span class="ok">Đã tự cập nhật dashboard · dữ liệu chốt <b>${dmy(DS.meta.asOf)}</b> · ${f0(DS.agents.length)} đại lý.</span>`;
  } catch (e) { console.error(e); }
});
start().catch((e) => { console.error(e); gate(`<h1>Lỗi khởi động</h1><p>${esc(e.message)}</p>`); });
window.RH_openPerson = (c) => openPerson(c); // dùng cho kiểm thử / liên kết ngoài
})();
</script>
